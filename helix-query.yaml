version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
      # not content pages of the locale sites (/en, /de-de, ...): fragments (incl. nav and
      # footer), error pages and data sheets; block libraries and templates aren't published
      # (paths.json), excluded as a safeguard
      - '/*/references/**'
      - '/*/error-pages/**'
      - '/*/data/**'
      - '/*/nav'
      - '/*/footer'
      - '/*/block-library'
      - '/*/block-library/**'
      - '/site-global-templates/**'
      - '/**/fragments/**'
      - '/**/modals/**'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https?:\/\/[^/]+(\/.*)")
      tags:
        select: head > meta[property="article:tag"]
        values: attribute(el, "content")
      # columns of the locales' bulk metadata sheets (e.g. /de-de/metadata.json)
      metaTitle:
        select: head > meta[name="meta-title"]
        value: attribute(el, "content")
      metaDescription:
        select: head > meta[name="meta-description"]
        value: attribute(el, "content")
      pageType:
        select: head > meta[name="page-type"]
        value: attribute(el, "content")
      contentType:
        select: head > meta[name="content-type"]
        value: attribute(el, "content")
      authorId:
        select: head > meta[name="author-id"]
        value: attribute(el, "content")
      publishDate:
        select: head > meta[name="publish-date"]
        value: attribute(el, "content")
      modifiedDate:
        select: head > meta[name="modified-date"]
        value: attribute(el, "content")
      readingTime:
        select: head > meta[name="reading-time"]
        value: attribute(el, "content")
      thumbnailImage:
        select: head > meta[name="thumbnail-image"]
        value: attribute(el, "content")
      featuredImage:
        select: head > meta[name="featured-image"]
        value: attribute(el, "content")
      region:
        select: head > meta[name="region"]
        value: attribute(el, "content")
      country:
        select: head > meta[name="country"]
        value: attribute(el, "content")
      language:
        select: head > meta[name="language"]
        value: attribute(el, "content")
      persona:
        select: head > meta[name="persona"]
        value: attribute(el, "content")
      campaignId:
        select: head > meta[name="campaign-id"]
        value: attribute(el, "content")
      featured:
        select: head > meta[name="featured"]
        value: attribute(el, "content")
      priority:
        select: head > meta[name="priority"]
        value: attribute(el, "content")
      # Filter List feature cards: shown as the large horizontal card, ranked by the priority
      featureCard:
        select: head > meta[name="feature-card"]
        value: attribute(el, "content")
      featuredPriority:
        select: head > meta[name="featured-priority"]
        value: attribute(el, "content")
